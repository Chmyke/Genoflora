# Frozen parameters of the common scenario (docs/Plan des essais.md, section 1).
# Lengths are in units of r_div. Rates are already multiplied by dt (per step).
seed = 20261124
r_div = 1.0          # radius at which a cell divides
growth = 0.001       # radius gained per step
mob_rep = 0.1        # dt * k_rep / gamma (compression)
mob_adh = 0.02       # dt * k_adh / gamma (tension, tent profile back to 0 at the reach)
reach = 1.2          # adhesion and diffusion range, as a factor of (ri + rj)
diffusion = 0.02     # dt * D
production = 0.001   # hormone produced per step where x > 0
decay = 0.001        # dt * lambda
divide_every = 20    # K: divisions are evaluated every K steps
spacing = 1.9        # initial lattice spacing
noise = 0.1          # initial position noise amplitude

[workspace]
resolver = "3"
members = ["crates/*"]
# Throwaway spikes live in their own workspace, outside check.ps1.
exclude = ["Spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
disallowed_types = "deny"
